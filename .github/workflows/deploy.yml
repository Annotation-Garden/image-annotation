name: Frontend Worker

# Builds the static export and serves it from the image-annotation-web Worker
# at annotation.garden/image-annotation/. Pull requests build and smoke-test
# only; pushes to main also deploy.
#
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are repository secrets synced
# from Infisical (project annot-garden, prod /image-annotation/ci). Change them
# there, not in GitHub.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'worker/**'
      - 'data/**'
      - 'images/downsampled/**'
      - 'annotations/nsd/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: frontend-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build the static export
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:static

      - name: Smoke-test the Worker under wrangler dev
        run: bash worker/smoke-test.sh

      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; they are synced from Infisical (annot-garden, prod /image-annotation/ci)"
            exit 1
          fi
          bunx wrangler@4 deploy
