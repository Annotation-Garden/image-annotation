# Image Annotation frontend: an assets-only Worker serving the Next.js static
# export at annotation.garden/image-annotation/.
#
# worker/stage.sh copies frontend/out to dist/image-annotation/, so stored
# paths match the public URLs and the asset handler serves every request
# directly: no Worker script runs, so requests do not count as Worker
# invocations. The handler's default html_handling ("auto-trailing-slash")
# redirects the bare "/image-annotation" to "/image-annotation/".
#
# Deployed by .github/workflows/deploy.yml on pushes to main. Manual deploy:
#   (cd frontend && pnpm run build:static) && bash worker/stage.sh
#   cd worker && bunx cfman wrangler --account <account> deploy

name = "image-annotation-web"
compatibility_date = "2026-10-01"

# Served only through the routes below; no account-scoped workers.dev name.
workers_dev = false

# A Worker route takes precedence over the main annotation.garden site (a
# Pages project) on the same hostname. The bare-path route has no wildcard,
# so it does not match "/image-annotation?x=1"; that request falls through to
# the main site, which must keep redirecting it to "/image-annotation/".
routes = [
  { pattern = "annotation.garden/image-annotation/*", zone_name = "annotation.garden" },
  { pattern = "annotation.garden/image-annotation", zone_name = "annotation.garden" },
]

[assets]
directory = "dist"
